[workspace]
resolver = "2"
members = [
    "crates/sync-core",
    "crates/hub-api",
    "crates/client-core",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
time = { version = "0.3", features = ["parsing"] }

# dev/test-only
wiremock = "0.6"
testcontainers = "0.23"
