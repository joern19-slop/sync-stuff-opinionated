[workspace]
resolver = "2"
members = [
    "crates/protocol-types",
    "crates/common",
    "crates/hub-api",
    "crates/client-core",
    "crates/client-desktop",
    "crates/client-web",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
time = { version = "0.3", features = ["parsing"] }
anyhow = "1"
axum = "0.8.9"
axum-extra = "0.12"
tower-http = "0.7.1"
threeway_merge = "0.1"
inotify = "0.11"
filetime = "0.2"
mime_guess = "2"
notify-rust = { version= "4", default-features = false, features = ["d"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# dev/test-only
wiremock = "0.6"
testcontainers = "0.23"
wasm-bindgen-test = "0.3"
