# Stage 1 of the build order: prove the redundancy story with zero custom
# code. Two independent, standalone CouchDB nodes (not a CouchDB cluster -
# each is its own single-node instance), wired together with plain
# continuous bidirectional replication via the built-in _replicator db.
#
# Usage:
#   docker compose up -d
#   ./deploy/init-replication.sh
#
# Then verify manually (or via sync-core/tests/replication_e2e.rs):
#   - write a doc to node-a, confirm it shows up on node-b within a few
#     seconds, and vice versa
#   - `docker compose stop node-a`, confirm node-b still serves reads and
#     accepts writes on its own
#   - `docker compose start node-a`, confirm it catches back up

services:
  node-a:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: hub
      COUCHDB_PASSWORD: hub-password
    ports:
      - "5984:5984"
    volumes:
      - node-a-data:/opt/couchdb/data

  node-b:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: hub
      COUCHDB_PASSWORD: hub-password
    ports:
      - "5985:5984"
    volumes:
      - node-b-data:/opt/couchdb/data

volumes:
  node-a-data:
  node-b-data:
