# Local-development CouchDB for hub-api: a single standalone node.
#
# This used to spin up two nodes (a manual Stage-1 redundancy proof), but that
# proof is now automated by `crates/hub-api/tests/replication_e2e.rs`
# (testcontainers), and every e2e suite starts its own containers - nothing here
# is needed to run the tests. This file just gives you a database to point
# hub-api at while developing.
#
# Usage:
#   docker compose up -d
#   curl -u hub:hub-password localhost:5984/
#
# Then run hub-api against it (hub-api creates the `filesync` db on startup):
#   COUCH_URL=http://localhost:5984 \
#   COUCH_USER=hub COUCH_PASSWORD=hub-password \
#   HUB_DEVICE_TOKENS=dev-token-1 \
#   cargo run -p hub-api

services:
  couchdb:
    image: docker.io/library/couchdb:3.3
    environment:
      COUCHDB_USER: hub
      COUCHDB_PASSWORD: hub-password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data

volumes:
  couchdb-data:
